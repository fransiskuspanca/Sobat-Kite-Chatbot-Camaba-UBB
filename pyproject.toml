[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatbot-ubb"
version = "0.1.0"
description = "Admin panel & API chatbot PMB Universitas Bangka Belitung"
requires-python = ">=3.12"

dependencies = [
    "Django==5.1.*",
    "django-ninja>=1.3",
    "django-cors-headers>=4.4",
    "django-unfold>=0.59,<0.60",   # tampilan admin; >=0.60 menarik Django 6
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",          # import_colab membaca Excel panitia PMB
    "numpy>=1.26",
    "torch>=2.2",
    "sentence-transformers>=3.0",
]

[tool.setuptools]
# Proyek Django, bukan pustaka: daftar paket ditulis eksplisit karena
# penemuan otomatis setuptools gagal saat ada banyak direktori top-level
# (deploy/, tests/, artifacts/, static/, templates/ bukan paket Python).
packages = ["api", "config", "config.settings", "faq", "percakapan", "retrieval"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-django>=4.8"]
# Produksi: gunicorn menjalankan layanan, sentry melacak exception,
# redis membagi hitungan rate limit antar-worker.
prod = ["gunicorn>=22.0", "sentry-sdk[django]>=2.0", "redis>=5.0"]

# ---------------------------------------------------------------------------
# CATATAN LINGKUNGAN — dibaca sebelum menyamakan versi antara laptop dan VPS.
#
# Mesin pengembangan saat ini: macOS 13.7 Intel (x86_64).
# PyTorch berhenti merilis wheel macOS x86_64 setelah 2.2.2, dan torch 2.2.2
# dikompilasi terhadap NumPy 1.x. Karena itu lingkungan LOKAL dipatok:
#
#     torch 2.2.2 · numpy 1.26.4 · transformers 4.45.2 · sentence-transformers 3.2.1
#
# Target produksi (Ubuntu 24.04 x86_64) TIDAK punya batasan ini dan sebaiknya
# memakai torch >= 2.6 + numpy 2.x. Kode di retrieval/ tidak bergantung pada
# API yang berbeda antar kedua kombinasi tersebut.
#
# Patokan lokal ada di requirements.txt.
# ---------------------------------------------------------------------------
