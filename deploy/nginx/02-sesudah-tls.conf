# TAHAP 2 — dipasang SESUDAH certbot berhasil menerbitkan sertifikat.
#
#   sudo cp 02-sesudah-tls.conf /etc/nginx/sites-available/chatbot-ubb
#   sudo nginx -t && sudo systemctl reload nginx
#
# Baris ssl_certificate di bawah mengikuti lokasi baku certbot. Bila certbot
# sudah menyuntikkannya sendiri, biarkan versi certbot yang dipakai.

limit_req_zone $binary_remote_addr zone=chat:10m rate=20r/m;

# ── API publik ────────────────────────────────────────────
server {
    # Sintaks `listen 443 ssl http2;` berlaku di SEMUA versi Nginx.
    # `http2 on;` hanya dikenal Nginx >= 1.25 dan membuat versi lama gagal
    # start dengan: unknown directive "http2".
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.chatbot-ubb.tech;

    ssl_certificate     /etc/letsencrypt/live/api.chatbot-ubb.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.chatbot-ubb.tech/privkey.pem;

    client_max_body_size 16k;          # query maksimal 500 karakter
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /v1/ {
        limit_req zone=chat burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        # Tanpa header ini semua request terlihat dari 127.0.0.1 dan rate limit
        # aplikasi akan memblokir SELURUH pengguna sekaligus.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }

    location /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location / { return 404; }
}

# ── Admin ─────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.chatbot-ubb.tech;

    ssl_certificate     /etc/letsencrypt/live/api.chatbot-ubb.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.chatbot-ubb.tech/privkey.pem;

    # Ganti dengan IP kantor sebenarnya. Bila panitia perlu akses dari luar
    # kantor, putuskan VPN vs login+2FA SEBELUM serah terima (Bagian 10.4).
    # allow 203.0.113.45;
    # deny all;

    location /static/ { alias /srv/chatbot_ubb/staticfiles/; expires 30d; }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;   # reindex butuh waktu
    }
}

# ── Redirect HTTP -> HTTPS ────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.chatbot-ubb.tech admin.chatbot-ubb.tech;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
