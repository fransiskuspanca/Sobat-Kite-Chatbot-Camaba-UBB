# TAHAP 1 — dipasang SEBELUM sertifikat TLS ada.
#
# Nginx tidak bisa start dengan `listen 443 ssl` bila sertifikat yang dirujuk
# belum ada. Pasang berkas ini dulu supaya certbot punya jalan masuk lewat
# port 80, baru ganti dengan 02-sesudah-tls.conf.
#
#   sudo cp 01-sebelum-tls.conf /etc/nginx/sites-available/chatbot-ubb
#   sudo ln -sf /etc/nginx/sites-available/chatbot-ubb /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.chatbot-ubb.tech -d admin.chatbot-ubb.tech

server {
    listen 80;
    server_name api.chatbot-ubb.tech admin.chatbot-ubb.tech;

    # Jalan masuk verifikasi certbot.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 200 'Menunggu pemasangan sertifikat TLS.';
        add_header Content-Type text/plain;
    }
}
